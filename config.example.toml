# ==========================================
# Liara Configuration
# ==========================================
[liara]
# [Required] Your personal or team Liara API token.
# NOTE: You can generate an API token at: https://console.liara.ir/API
api_token = "your_liara_api_token_here"

# [Optional] The Team ID, if you are accessing resources within a specific team account.
# team_id = "your_team_id_here"

# [Optional] Overrides the default Liara API endpoint URL. Defaults to "https://api.liara.ir".
# api_url = ""

# [Optional] A list of specific database names to target for replication.
# NOTE: If no databases are specified, backups for all databases associated with
# the account (or team) will be replicated automatically.
# target_databases = ["my-postgres-db", "my-mongo-db"]


# ==========================================
# S3 Storage Configuration
# ==========================================
[s3]
# [Optional] A global prefix (folder path) applied to all buckets.
# This can be overridden individually within the bucket settings below.
# default_prefix = "backups/databases/"

# ------------------------------------------
# S3 Encryption Settings
# ------------------------------------------
[s3.encryption]
# [Optional] Determines whether backup files should be encrypted before upload.
enabled = false

# [Required if enabled = true] A secure 32-byte hexadecimal encryption key.
# You can generate a secure key by running the following command in your terminal:
# python -c "import secrets; print(secrets.token_hex(32))"
# WARNING: Please store this secret key in a safe and secure location! If you
# lose this key, you will permanently lose the ability to decrypt and restore
# your backups.
# secret_key = "your_secret_key_here"


# ------------------------------------------
# S3 Buckets Configuration
# ------------------------------------------
# Define your target S3 storage buckets here. You are allowed to define as many
# destination buckets as you want simply by duplicating the [[s3.buckets]] block
# for each new bucket.

[[s3.buckets]]
# [Required] The exact name of the destination S3 bucket.
name = "my-production-backups"

# [Required] The S3 access key ID.
access_key = "your_s3_access_key"

# [Required] The S3 secret access key.
secret_key = "your_s3_secret_key"

# [Optional] The S3 region name (e.g., us-east-1, me-central-1).
# region = "us-east-1"

# [Optional] A custom endpoint URL. This is required for S3-compatible storage
# providers such as Liara Object Storage, ArvanCloud Object Storage, MinIO,
# Cloudflare R2, DigitalOcean Spaces, etc.
# endpoint_url = "https://storage.iran.liara.space"

# [Optional] A friendly display name for the bucket, used for logging or display purposes.
# alias = "Production Backup Bucket"

# [Optional] A specific prefix (folder path) for this bucket.
# If provided, this overrides the global `s3.default_prefix` specified above.
# prefix = "prod/"

# --- Example: Configuring a second destination bucket ---
# [[s3.buckets]]
# name = "my-staging-backups"
# access_key = "another_s3_access_key"
# secret_key = "another_s3_secret_key"
# endpoint_url = "https://storage.iran.liara.space"
# alias = "Staging Backups"
# prefix = "staging/"
